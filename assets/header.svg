<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Shikhar Mishra, Full-Stack and Backend Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1200" height="240" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="240" rx="14" fill="url(#dots)"/>

  <circle cx="1020" cy="30" r="200" fill="url(#glow)">
    <animate attributeName="cx" values="1020;960;1020" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="230" r="170" fill="url(#glow)" opacity="0.6">
    <animate attributeName="cx" values="140;220;140" dur="11s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="108" text-anchor="middle" fill="#ffffff" font-size="58" font-weight="700"
        font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" letter-spacing="1">Shikhar Mishra</text>
  <text x="600" y="152" text-anchor="middle" fill="#c7d2fe" font-size="22"
        font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" letter-spacing="3">FULL-STACK &amp; BACKEND ENGINEER</text>
  <text x="600" y="196" text-anchor="middle" fill="#e0e7ff" fill-opacity="0.85" font-size="16"
        font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Courier New', monospace">&gt; queues · retries · indexing · LLM features</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
